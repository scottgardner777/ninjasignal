[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ninjasignal"
version = "0.1.0"
description = "Python client for Ninja Labz predictive threat intelligence — live ransomware groups, victims, and what the lab predicts next."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Scott Gardner", email = "the_v01d@ninja.ing" }]
keywords = ["threat-intelligence", "ransomware", "predictive-intelligence", "cti",
            "security", "osint", "ninja-labz", "ninjasignal"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = []   # stdlib only — no runtime dependencies

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://ninjalabz.io"
"Predictive Intel Report" = "https://ninjalabz.io/intel-report/"
"Data Feeds" = "https://ninjalabz.io/feeds/"
Source = "https://github.com/scottgardner777/ninjasignal"

[project.scripts]
ninja = "ninjasignal.cli:main"
ninjasignal = "ninjasignal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ninjasignal"]
